s3:
  hotspots_key: hotspots/sts_hotspots.json
  findings_prefix: sts/
  sanctioned_prefix: sanctioned/
  captures_prefix: captures/

land:
  - data/land/ne_10m_land.geojson
  - data/land/ne_10m_minor_islands.geojson

ai2:
  root: C:\Users\Shadow\projects\ai2-detectors
  scratch_root: C:\t
  env:
    RSLP_APPLY_WORKERS: "0"
    RSLEARN_NUM_DATA_LOADER_WORKERS: "0"
    PYTHONIOENCODING: utf-8

ais_archive:
  tls_root_cert: data/secrets/ais_archive_cert.pem
  default_user: gizmosql_user

structures:
  path: data/structures/osm_structures.geojson
  overpass_url: https://overpass-api.de/api/interpreter

runs:
  path: data/runs

catalogue:
  log_path: data/catalogue/scans.jsonl
  jobs_prefix: catalogue/jobs/
  results_prefix: catalogue/results/
  claims_prefix: catalogue/claims/
  artifacts_prefix: catalogue/artifacts/
  reviews_prefix: catalogue/reviews/

worker:
  path: data/worker
  attempt_wait_seconds: 120
  attempt_poll_seconds: 2
  queue:
    heartbeat_seconds: 60
    lease_seconds: 900
    max_retries: 1
    retry_delay_seconds: 300

app:
  host: 127.0.0.1
  port: 8765

equasis:
  cache: data/equasis/cache.json

sanctions:
  path: data/sanctions/sanctioned_vessels.csv
